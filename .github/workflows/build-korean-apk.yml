name: Build Korean APK

on:
  push:
    branches:
      - main
      - feat/korean-localization
    paths:
      - "android/**"
      - ".github/workflows/build-korean-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Android 37 SDK
        run: |
          # Ubuntu GitHub runners already include Android command-line tools.
          # Avoid setup-android, which attempts to install the removed "tools" package.
          SDK_MANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-37" "build-tools;37.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build installable Korean development APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDev --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PairFree-Korean-dev-APK
          path: android/app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 30
